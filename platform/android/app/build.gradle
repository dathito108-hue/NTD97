plugins {
    id "com.android.application"
}

android {
    namespace "ai.ntd97.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "ai.ntd97.mobile"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
