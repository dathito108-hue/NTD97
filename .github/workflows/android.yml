name: android

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ntd-android-bridge/**"
      - "crates/ntd-mobile-shell/**"
      - "crates/ntd-runtime/**"
      - "platform/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ntd-android-bridge/**"
      - "crates/ntd-mobile-shell/**"
      - "crates/ntd-runtime/**"
      - "platform/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NDK_VERSION: "27.0.12077973"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.80.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build native NTD97 runtime bridge
        run: |
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="${NDK_BIN}/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${NDK_BIN}/x86_64-linux-android26-clang"

          cargo build --release -p ntd-android-bridge --target aarch64-linux-android
          cargo build --release -p ntd-android-bridge --target armv7-linux-androideabi
          cargo build --release -p ntd-android-bridge --target x86_64-linux-android

          mkdir -p \
            platform/android/app/src/main/jniLibs/arm64-v8a \
            platform/android/app/src/main/jniLibs/armeabi-v7a \
            platform/android/app/src/main/jniLibs/x86_64

          cp target/aarch64-linux-android/release/libntd97_android.so \
            platform/android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libntd97_android.so \
            platform/android/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libntd97_android.so \
            platform/android/app/src/main/jniLibs/x86_64/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle -p platform/android :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ntd97-debug-apk
          path: platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM for lifecycle validation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate Android lifecycle on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            APK="platform/android/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="ai.ntd97.mobile"

            adb install -r "${APK}"
            adb shell pm grant "${PACKAGE}" android.permission.POST_NOTIFICATIONS
            adb shell pm grant "${PACKAGE}" android.permission.RECORD_AUDIO
            adb shell appops set "${PACKAGE}" SYSTEM_ALERT_WINDOW allow

            adb shell am start -W -n "${PACKAGE}/.MainActivity"
            test -n "$(adb shell pidof "${PACKAGE}" | tr -d '\r')"

            adb shell am start -W \
              -n "${PACKAGE}/.NtdLifecycleProbeActivity" \
              --ez seed_reboot true
            sleep 2

            PROBE="$(adb shell run-as "${PACKAGE}" cat files/ntd97-lifecycle-probe.txt | tr -d '\r')"
            printf '%s\n' "${PROBE}"

            for REQUIRED in \
              native_host=ok \
              avatar=ok \
              audio_bridge=ok \
              notification_channels=ok \
              foreground_request=ok \
              overlay_request=ok \
              persistent_job=ok \
              reboot_marker=ok
            do
              printf '%s\n' "${PROBE}" | grep -q "^${REQUIRED}$"
            done

            adb shell dumpsys activity services "${PACKAGE}" | grep -q "NtdOverlayService"

            adb reboot
            adb wait-for-device
            for ATTEMPT in $(seq 1 90); do
              if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            adb shell input keyevent 82 || true
            adb shell am start -W -n "${PACKAGE}/.MainActivity"
            test -n "$(adb shell pidof "${PACKAGE}" | tr -d '\r')"

            adb shell am start -W -n "${PACKAGE}/.NtdLifecycleProbeActivity"
            sleep 2
            POST_REBOOT="$(adb shell run-as "${PACKAGE}" cat files/ntd97-lifecycle-probe.txt | tr -d '\r')"
            printf '%s\n' "${POST_REBOOT}"
            printf '%s\n' "${POST_REBOOT}" | grep -q '^native_host=ok
            printf '%s\n' "${POST_REBOOT}" | grep -q '^avatar=ok
            printf '%s\n' "${POST_REBOOT}" | grep -q '^audio_bridge=ok
            printf '%s\n' "${POST_REBOOT}" | grep -q '^notification_channels=ok
