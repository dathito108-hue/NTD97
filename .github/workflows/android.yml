name: android

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ntd-android-bridge/**"
      - "crates/ntd-mobile-shell/**"
      - "crates/ntd-runtime/**"
      - "platform/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ntd-android-bridge/**"
      - "crates/ntd-mobile-shell/**"
      - "crates/ntd-runtime/**"
      - "platform/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NDK_VERSION: "27.0.12077973"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.80.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.7 --locked

      - name: Build native NTD97 runtime bridge
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -p 26 \
            -o platform/android/app/src/main/jniLibs \
            build --release -p ntd-android-bridge

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle -p platform/android :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ntd97-debug-apk
          path: platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
