name: m11-stories260k-evidence

on:
  push:
    branches:
      - m11-stories260k-source-equivalence
    paths:
      - ".github/workflows/m11-stories260k-evidence.yml"
      - "crates/ntd-assimilation/**"
      - "crates/ntd-capsule/**"
      - "crates/ntd-ir/**"
      - "crates/ntd-runtime/**"

permissions:
  contents: read

concurrency:
  group: m11-stories260k-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download pinned stories260K GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output stories260K.gguf \
            "https://huggingface.co/ggml-org/tiny-llamas/resolve/main/stories260K.gguf?download=true"
          printf '%s  %s\n' \
            '047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b' \
            'stories260K.gguf' | sha256sum --check --strict

      - name: Build same-step llama2.c source reference
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output stories260K.bin \
            "https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/stories260K.bin?download=true"
          curl --fail --location --retry 3 \
            --output tok512.bin \
            "https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/tok512.bin?download=true"
          curl --fail --location --retry 3 \
            --output llama2c-run.c \
            "https://raw.githubusercontent.com/karpathy/llama2.c/350e04fe35433e6d2941dce5a1f53308f87058eb/run.c"
          sha256sum stories260K.bin tok512.bin
          cc -O3 -std=c11 -o llama2c-reference llama2c-run.c -lm
          ./llama2c-reference stories260K.bin \
            -z tok512.bin -t 0.0 -n 128 \
            > source-output.txt 2> source-stderr.txt
          wc -c source-output.txt
          sha256sum source-output.txt

      - name: Run NTD97 source-equivalence evidence
        run: >-
          cargo run -p ntd-assimilation --bin stories260k-evidence --
          stories260K.gguf source-output.txt
