[workspace]
resolver = "2"
members = [
    "crates/ntd-core",
    "crates/ntd-ir",
    "crates/ntd-capsule",
    "crates/ntd-runtime",
    "crates/ntd-platform",
    "crates/ntd-android-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
